# ---- Fundamentals ----
# Reduce delay after Escape (avoids lag switching modes in Neovim)
set -sg escape-time 10

# Let Neovim detect pane focus gain/loss (e.g. auto-reload changed files)
set -g focus-events on

# Scrollback lines kept per pane (default 2000 is often too short)
set -g history-limit 50000

# ---- Prefix ----
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ---- Reload config ----
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# ---- Mouse ----
set -g mouse on

# ---- Splits (inherit current pane's path) ----
bind | split-window -hc "#{pane_current_path}"
bind - split-window -vc "#{pane_current_path}"

# ---- Vim-style pane navigation and copy mode ----
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# copy not only inside to tmux but leverage macos clipboard 
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# ---- Daily comfort ----
# Skip confirmation before killing a pane/window
bind x kill-pane
bind X kill-window

# Auto-rename windows based on the running command
set -g automatic-rename on

# No audible/visual bell
set -g bell-action none
set -g visual-bell off

# Status bar refresh rate (default 15s is too slow for a clock, etc.)
set -g status-interval 5

# ---- Fast navigation ----
# Interactive session/window picker
bind S choose-tree -s

# Jump back to the last used window (like alt-tab)
bind Tab last-window

# Cycle through windows without repeating the prefix each time
bind -r n next-window
bind -r p previous-window

# Useful popups
bind g display-popup -E -w 80% -h 80% "lazygit"
bind f display-popup -E -w 80% -h 80% "fzf"

# ---- True color support (WezTerm supports 24-bit color) ----
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# ---- 1-based indexing ----
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# ---- Panes ----
set -g pane-border-lines simple
set -g pane-border-style "fg=#393552"
set -g pane-active-border-style "fg=#c4a7e7"

# ---- Status bar (Rose Pine Moon palette) ----
set -g status-style "bg=#232136,fg=#e0def4"
set -g status-left ""
set -g status-right "#[fg=#908caa] %H:%M "

set -g window-status-current-format "#[fg=#232136,bg=#c4a7e7] #I:#W #[fg=#c4a7e7,bg=#232136]"
set -g window-status-format "#[fg=#908caa,bg=#2a273f] #I:#W "

# ---- Plugins (TPM) ----
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# tmux-continuum: auto-save every 15 min, auto-restore on tmux start
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# tmux-resurrect: also restore pane contents (scrollback), not just layout
set -g @resurrect-capture-pane-contents 'on'

# Initialize TPM (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
